<svg xmlns="http://www.w3.org/2000/svg" width="760" height="72" viewBox="0 0 760 72" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer specialties</title>
  <desc id="desc">A typing animation showing Full Stack Developer, AI and ML Builder, and Interactive Web Creator.</desc>
  <rect width="760" height="72" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="43" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600">
    <tspan>&gt; </tspan>
    <tspan>
      <tspan opacity="0">Full Stack Developer<tspan>|</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.72;1" dur="9s" repeatCount="indefinite"/></tspan>
      <tspan opacity="0">AI &amp; ML Builder<tspan>|</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.72;1" dur="9s" begin="3s" repeatCount="indefinite"/></tspan>
      <tspan opacity="0">Interactive Web Creator<tspan>|</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.72;1" dur="9s" begin="6s" repeatCount="indefinite"/></tspan>
    </tspan>
  </text>
</svg>
